<!doctype html>

    <link rel="stylesheet" href="style.css" />
    <title>NW Daily Reward</title>

<body>

            </div>

            <div class="label-top">RESTERENDE</div>
            <div class="countdown" id="countdown">00:00:00</div>
            <div class="label-mid">F&Oslash;R N&AElig;STE REWARD</div>

            <div class="reward-chip" id="next-reward">$5,000 cash</div>

            <div class="progress">
                <div class="bar" id="next-progress"></div>
            </div>

            <div class="meta-row">
                <span id="online-time">Online: 00:00:00</span>
            </div>
        </article>
    </section>

    <script src="app.js"></script>
</body>
</html>
